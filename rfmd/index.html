}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.bar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--rule);
  padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-family:var(--mono);font-size:14px;font-weight:600;margin:0 14px 0 0;letter-spacing:-.01em}
select,input[type=search]{font-family:var(--mono);font-size:12px;padding:4px 7px;border:1px solid var(--rule);
  border-radius:3px;background:var(--paper);color:var(--ink)}
label.chk{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.counts{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.navbar{display:flex;gap:12px;align-items:center;padding:10px 18px;background:var(--card);
  border-bottom:1px solid var(--rule);position:sticky;top:47px;z-index:9}
input[type=range]{flex:1;accent-color:var(--accent)}
button{font-family:var(--mono);font-size:12px;padding:5px 11px;border:1px solid var(--rule);
  border-radius:3px;background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.pos{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(320px,1.1fr) minmax(300px,1fr);gap:18px;padding:18px;
  align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:880px){main{grid-template-columns:1fr}}
.shots{display:grid;gap:6px;background:#0B0D11;padding:8px;border-radius:4px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.shots img{width:100%;height:auto;border-radius:2px;display:block;object-fit:contain}
.shots.one{grid-template-columns:1fr}
.shots.refshots{background:#141018;outline:1px solid var(--accent);outline-offset:-1px}

.shots.small img{width:88px;height:auto}
.shots.shrink{max-width:340px}
.shots.shrink img{width:auto;max-width:100%;max-height:300px;margin:0 auto}
.blk{margin-bottom:14px}
.blkhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;

.panel{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:14px;
  display:flex;flex-direction:column;gap:12px}
.prompt{font-size:15px;margin:0;line-height:1.4}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px}
.p-mem{background:var(--memBg);color:var(--mem)} .p-unmem{background:var(--unmemBg);color:var(--unmem)}
.p-warn{background:var(--warnBg);color:var(--warn)} .p-flat{background:var(--paper);color:var(--muted)}
.p-new{background:var(--accent);color:#fff}
.built{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:6px 18px;

.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reason{font-size:13px;line-height:1.5;margin:0;background:var(--paper);border-radius:3px;padding:9px 11px;
  border-left:2px solid var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.m{background:var(--card);padding:5px 8px;display:flex;justify-content:space-between;gap:6px}
.m2{background:var(--card);padding:7px 9px 5px}
.m2head{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.pol{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.05em}
.m2head .mv{margin-left:auto}
.hist{width:100%;height:34px;display:block}
.hist .hb{fill:var(--rule)}
.hist .hmark{stroke:var(--accent);stroke-width:2}
.hpct{font-family:var(--mono);font-size:9px;color:var(--accent);margin-top:1px}
.hax{font-family:var(--mono);font-size:8.5px;color:var(--muted);display:flex;justify-content:space-between;
  gap:4px;margin-top:1px}
.hax .hn{color:var(--rule)}
.mk{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.mv{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.verdictbox{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.verdictbox h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:0}
textarea{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;

.hint{font-family:var(--mono);font-size:10px;color:var(--muted)}
.done{font-family:var(--mono);font-size:11px;color:var(--unmem)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
const $ = s => document.querySelector(s);
const KEY = 'rfmd_human_labels_v1';
let human = {};
try { human = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { human = {}; }

// Verdicts saved before sample ids became content-derived are keyed by the old
// positional integer. Re-point them once, using the legacy_id the manifest still
// carries, so a rebuild never strands earlier review work.
(function migrateLegacyIds(){
  const numeric = Object.keys(human).filter(k => /^\d+$/.test(k));
  if (!numeric.length) return;
  const byLegacy = {};
  SAMPLES.forEach(s => { byLegacy[s.legacy_id] = s.id; });
  let moved = 0;
  numeric.forEach(k => {
    const to = byLegacy[k];
    if (to !== undefined && human[to] === undefined){ human[to] = human[k]; moved++; }
    delete human[k];
  });
  save();
  if (moved) console.log(`migrated ${moved} verdicts to stable sample ids`);
})();

const M = ['NDN','BE','CAE-d','Hessian','pLaplace','InvMM','Anisotropy'];

// Which direction means "more memorized", from each metric's definition in the
// paper (Sec. 3), NOT fitted to these labels. Deriving it from the labels would
// be circular: the labels are the thing under review, and the analysis code
// sidesteps the question entirely with max(auc, 1-auc).
//   NDN, BE       larger conditional/unconditional divergence
//   Hessian       sharper, more localised probability peaks
//   pLaplace      higher curvature of the learned landscape
//   Anisotropy    stronger angular alignment
//   CAE-d         attention CONCENTRATES when memorised, so lower entropy
//   InvMM         minimum KLD to the Gaussian prior, so lower is easier to invert
const POLARITY = {NDN:1, BE:1, 'CAE-d':-1, Hessian:1, pLaplace:1, InvMM:-1, Anisotropy:1};
let metricScope = 'current';   // 'current' = this model+dataset, 'all' = this model

// Distributions are recomputed per render; 7 metrics over ~1.2k samples is
// trivial, and caching would go stale the moment a rebuild changes the manifest.
function metricPool(s, k){
  return SAMPLES.filter(x => x.model === s.model &&
                        (metricScope === 'all' || x.dataset === s.dataset))
    .map(x => x.metrics[k])
    .filter(v => v !== null && v !== undefined && isFinite(v));
}

function histSVG(vals, v, pol){
  const n = vals.length;
  if (!n) return '<div class="hint">no distribution</div>';
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const B = 32, W = 168, H = 34, bw = W / B;
  const bins = new Array(B).fill(0);
  vals.forEach(x => { let i = Math.floor((x - mn) / span * B); bins[Math.max(0, Math.min(B-1, i))]++; });
  const top = Math.max(...bins) || 1;
  let bars = '';
  for (let i = 0; i < B; i++){
    const h = bins[i] / top * H;
    bars += `<rect x="${(i*bw).toFixed(2)}" y="${(H-h).toFixed(2)}" width="${(bw*0.85).toFixed(2)}" height="${h.toFixed(2)}" class="hb"/>`;
  }
  const ok = (v !== null && v !== undefined && isFinite(v));
  const x = ok ? ((v - mn) / span) * W : null;
  // Raw percentile along the metric's own axis. Deliberately NOT re-expressed
  // as "toward memorised": the axis stays as the metric defines it, and the
  // arrow in the header says which end means more memorised. Nothing here is
  // derived from labels, which is the point, since the labels are unsettled.
  const below = ok ? vals.filter(z => z <= v).length / n : 0;
  const marker = ok
    ? `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${H}" class="hmark"/>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="hist" preserveAspectRatio="none">${bars}${marker}</svg>
          <div class="hax"><span>${fmt(mn)}</span><span class="hn">n=${n}</span><span>${fmt(mx)}</span></div>
          ${ok ? `<div class="hpct">${Math.round(below*100)}th pct of this distribution</div>`
               : '<div class="hpct">no value</div>'}`;
}
let view = [], cur = 0;

function uniq(f){ return [...new Set(SAMPLES.map(f))].sort(); }

function fillSelect(el, vals, allLabel){
  el.innerHTML = `<option value="">${allLabel}</option>` +
    vals.map(v => `<option value="${v}">${v}</option>`).join('');
}

function applyFilters(){
  const model = $('#fModel').value, ds = $('#fDataset').value, jv = $('#fJudge').value;
  const onlyUn = $('#fUnreviewed').checked, onlyDis = $('#fDisagree').checked;
  const onlyNew = $('#fChanged').checked;
  const onlySplit = $('#fSplit').checked;
  const q = $('#fSearch').value.trim().toLowerCase();
  view = SAMPLES.filter(s => {
    if (model && s.model !== model) return false;
    if (ds && s.dataset !== ds) return false;
    if (jv === 'judged' && !s.judge) return false;
    if (jv === 'unjudged' && s.judge) return false;
    if (jv === 'mem' && !(s.judge && s.judge.verdict)) return false;
    if (jv === 'notmem' && !(s.judge && !s.judge.verdict)) return false;
    if (jv === 'trusted' && !(s.judge && s.judge.trusted)) return false;
    if (onlyUn && human[s.id]) return false;
    if (onlyNew && !s.delta) return false;
    if (onlySplit && !(s.judge && s.judge.mesh !== null && s.judge.mesh !== undefined
                       && s.judge.mesh !== s.judge.cross_seed)) return false;
    if (onlyDis){
      if (!s.judge) return false;
      const carried = !/unmemorized/.test(s.carried_label);
      if (s.judge.verdict === carried) return false;
    }
    if (q && !(s.prompt || '').toLowerCase().includes(q) &&
        !(s.file || '').toLowerCase().includes(q)) return false;
    return true;
  });
  cur = 0;
  $('#slider').max = Math.max(0, view.length - 1);
  render();
}

function fmt(v){
  if (v === null || v === undefined) return '--';
  const a = Math.abs(v);
  if (a >= 10000 || (a > 0 && a < 0.01)) return v.toExponential(2);
  if (a >= 100) return v.toFixed(1);
  return v.toFixed(3);
}

function render(){
  const n = view.length;
  $('#counts').textContent =
    `${n} of ${SAMPLES.length} shown · ${Object.keys(human).length} reviewed`;
  if (!n){
    $('#stage').innerHTML = '<div class="panel"><p>No samples match these filters.</p></div>';
    $('#pos').textContent = '0 / 0';
    return;
  }
  cur = Math.max(0, Math.min(cur, n - 1));
  $('#slider').value = cur;
  $('#pos').textContent = `${cur + 1} / ${n}`;
  const s = view[cur];
  const carriedMem = !/unmemorized/.test(s.carried_label);

  const grid = (paths, extra) => `<div class="shots ${paths.length === 1 ? 'one' : ''} ${extra||''}">` +
    paths.map(p => `<img src="${ASSET_BASE}${p}" alt="" loading="lazy">`).join('') + '</div>';

  // Display sizing, per arm:
  //  - SD 1.4 on LAION IS the validated memorized/unmemorized ground truth, so
  //    it needs no separate reference.
  //  - single-image LAION pairs (DPO, DanceGRPO) render large; shrink BOTH the
  //    generation and its reference so the pair fits on one screen without scroll.
  //  - multi-frame (4-view 3D / video) references are shown as compact thumbnails
  //    at roughly single-frame size, since they are only a comparison aid.
  const isSD14 = /SD ?1\.4/.test(s.model);
  const shrinkPair = /^(DPO|DanceGRPO)$/.test(s.model);
  const refMulti = s.reference && s.reference.images.length > 1;

  const imgs = s.images.length
    ? grid(s.images, shrinkPair ? 'shrink' : '')
    : '<div class="panel"><span class="pill p-warn">render not retained</span></div>';

  // The reference is what the judge actually compared the generation against:
  // the real Objaverse mesh rendered from 4 azimuths, or SD 1.4's own output
  // for the same LAION prompt. Without it on screen there is no way to check a
  // verdict by eye, which is the entire point of this page.
  let ref;
  if (isSD14){
    ref = `<div class="blk"><div class="blkhead">Reference</div>
           <div class="panel"><span class="pill p-unmem">validated ground truth</span>
           <div class="hint">SD 1.4 on LAION is itself the verified memorized /
           unmemorized ground truth, so no separate reference is needed.</div></div></div>`;
  } else if (s.reference){
    const refExtra = 'refshots' + (refMulti ? ' small' : (shrinkPair ? ' shrink' : ''));
    ref = `<div class="blk"><div class="blkhead">Reference &middot; ${s.reference.kind}</div>
           ${grid(s.reference.images, refExtra)}</div>`;
  } else {
    ref = `<div class="blk"><div class="blkhead">Reference</div>
           <div class="panel"><span class="pill p-warn">no reference material for this arm</span>
           <div class="hint">Nothing to compare against, so any verdict here rests on the
           generation alone.</div></div></div>`;
  }

  const DELTA = {
    newly_judged: 'newly judged since last build',
    flipped:      'verdict FLIPPED since last build',
    promoted:     'now from a validated judge',
    rejudged:     'rejudged by a different run',
    new_sample:   'new sample since last build',
  };
  const deltaPill = s.delta
    ? `<span class="pill ${s.delta === 'flipped' ? 'p-warn' : 'p-new'}">${DELTA[s.delta]}</span>` : '';

  let judge = '<div class="row"><span class="pill p-flat">no judge verdict</span></div>';
  if (s.judge){
    const v = s.judge.verdict;
    judge = `
      <div class="row">
        <span class="pill ${v ? 'p-mem' : 'p-unmem'}">judge: ${v ? 'memorized' : 'not memorized'}</span>
        <span class="lbl">conf ${s.judge.confidence ?? '?'}</span>
        <span class="pill ${s.judge.trusted ? 'p-unmem' : 'p-warn'}">${s.judge.trusted ? 'validated judge' : 'superseded judge'}</span>
        ${v !== carriedMem ? '<span class="pill p-warn">differs from carried label</span>' : ''}
        ${deltaPill}
      </div>
      ${s.judge.mesh === null || s.judge.mesh === undefined ? '' : `
      <div class="row">
        <span class="lbl">signals</span>
        <span class="pill ${s.judge.mesh ? 'p-mem' : 'p-unmem'}">mesh: ${s.judge.mesh ? 'mem' : 'not mem'}</span>
        <span class="pill ${s.judge.cross_seed ? 'p-mem' : 'p-unmem'}">cross-seed: ${s.judge.cross_seed ? 'mem' : 'not mem'}</span>
        ${s.judge.mesh !== s.judge.cross_seed
          ? '<span class="pill p-warn">SIGNALS DISAGREE, mesh won by policy</span>' : ''}
      </div>`}
      <div class="row" style="display:none">
      </div>
      <p class="reason">${(s.judge.reasoning || '(no reasoning recorded)').replace(/</g,'&lt;')}</p>
      <div class="meta">${s.judge.method || ''} · ${s.judge.source}</div>`;
  }

  const h = human[s.id] || {};
  $('#stage').innerHTML = `
    <div>
      <div class="blk">
        <div class="blkhead">Generated &middot; ${s.model}${s.seed !== null ? ', seed ' + s.seed : ''}</div>
        ${imgs}
        ${s.image_borrowed ? '<div class="hint">representative frame from this leg, not this exact seed</div>' : ''}
      </div>
      ${ref}
    </div>
    <div class="panel">
      <p class="prompt">${(s.prompt || '(no prompt recorded)').replace(/</g,'&lt;')}</p>
      <div class="row">
        <span class="lbl">carried label</span>
        <span class="pill ${carriedMem ? 'p-mem' : 'p-unmem'}">${s.carried_label}</span>
        <span class="lbl">${s.model} · ${s.dataset}${s.seed !== null ? ' · seed ' + s.seed : ''}</span>
      </div>
      <div class="meta">${s.file}${s.uid ? '<br>uid ' + s.uid : ''}</div>
      ${s.cell_note ? `<div class="hint">${s.cell_note}</div>` : ''}
      ${judge}
      <div class="row">
        <span class="lbl">metrics vs</span>
        <button id="scopeCur" class="${metricScope==='current'?'on':''}">this dataset</button>
        <button id="scopeAll" class="${metricScope==='all'?'on':''}">all datasets for ${s.model}</button>
      </div>
      <div class="metrics">${M.map(k => {
        const pol = POLARITY[k], pool = metricPool(s, k);
        return `<div class="m2">
          <div class="m2head">
            <span class="mk">${k}</span>
            <span class="pol" title="${pol>0?'higher':'lower'} means more memorised">${pol>0?'&uarr;':'&darr;'} mem</span>
            <span class="mv">${fmt(s.metrics[k])}</span>
          </div>
          ${histSVG(pool, s.metrics[k], pol)}
        </div>`; }).join('')}</div>
      <div class="verdictbox">
        <h3>Your call</h3>
        <div class="row">
          <button data-v="memorized" class="${h.verdict==='memorized'?'on':''}">memorized</button>
          <button data-v="not memorized" class="${h.verdict==='not memorized'?'on':''}">not memorized</button>
          <button data-v="unsure" class="${h.verdict==='unsure'?'on':''}">unsure</button>
          ${h.verdict ? '<span class="done">saved</span>' : ''}
        </div>
        <textarea id="note" placeholder="note (optional)">${h.note || ''}</textarea>
        <div class="hint">keys: &larr; &rarr; to move · 1 memorized · 2 not memorized · 3 unsure</div>
      </div>
    </div>`;

  $('#stage').querySelectorAll('button[data-v]').forEach(b =>
    b.onclick = () => setVerdict(b.dataset.v));
  const sc = $('#scopeCur'), sa = $('#scopeAll');
  if (sc) sc.onclick = () => { metricScope = 'current'; render(); };
  if (sa) sa.onclick = () => { metricScope = 'all'; render(); };
  $('#note').onchange = e => {
    const s2 = view[cur];
    human[s2.id] = Object.assign({}, human[s2.id], {note: e.target.value, ...stamp(s2)});
    save();
  };
}

function stamp(s){
  return {model: s.model, dataset: s.dataset, carried_label: s.carried_label,
          file: s.file, judge: s.judge ? (s.judge.verdict ? 'memorized' : 'not memorized') : '',
          judge_trusted: s.judge ? s.judge.trusted : ''};
}

function setVerdict(v){
  const s = view[cur];
  human[s.id] = Object.assign({}, human[s.id], {verdict: v, ...stamp(s)});
  save();
  if (cur < view.length - 1){ cur++; }
  render();
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(human)); } catch(e) {}
}

function exportCsv(){
  const cols = ['id','model','dataset','carried_label','file','judge','judge_trusted','verdict','note'];
  const rows = [cols.join(',')];
  Object.entries(human).forEach(([id, h]) => {
    rows.push(cols.map(c => {
      const v = c === 'id' ? id : (h[c] ?? '');
      return `"${String(v).replace(/"/g,'""')}"`;
    }).join(','));
  });
  const blob = new Blob([rows.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rfmd_human_labels.csv';
  a.click();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight'){ cur++; render(); }
  else if (e.key === 'ArrowLeft'){ cur--; render(); }
  else if (e.key === '1') setVerdict('memorized');
  else if (e.key === '2') setVerdict('not memorized');
  else if (e.key === '3') setVerdict('unsure');
});

window.addEventListener('DOMContentLoaded', () => {
  fillSelect($('#fModel'), uniq(s => s.model), 'all models');
  fillSelect($('#fDataset'), uniq(s => s.dataset), 'all datasets');
  ['#fModel','#fDataset','#fJudge','#fUnreviewed','#fDisagree','#fChanged','#fSplit'].forEach(
    id => $(id).onchange = applyFilters);
  $('#fSearch').oninput = applyFilters;
  $('#slider').oninput = e => { cur = +e.target.value; render(); };
  $('#prev').onclick = () => { cur--; render(); };
  $('#next').onclick = () => { cur++; render(); };
  $('#export').onclick = exportCsv;
  $('#reset').onclick = () => {
    if (confirm('Clear all of your saved verdicts?')){ human = {}; save(); render(); }
  };
  applyFilters();
});
</script>
</body></html>
